name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libopenblas-dev
      # Los runners de GitHub tienen AVX2+FMA; solo se corren los tests (no se mide en CI).
      - run: cmake -S . -B build -G Ninja -DGEMM_SANITIZE=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --target gemm_tests
      - run: ctest --test-dir build --output-on-failure
